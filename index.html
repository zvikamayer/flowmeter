<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💧 Flow Meter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 20px; color: #adf; }

    .clock {
      font-size: 4rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #fff;
      font-family: monospace;
    }
    .date {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 30px;
    }

    .status-card {
      background: #111;
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 400px;
      border: 2px solid #333;
      transition: border-color 0.3s;
    }
    .status-card.alert {
      border-color: #f44;
      background: #200;
    }
    .status-value {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .status-value.ok { color: #4f4; }
    .status-value.high { color: #f44; }

    .last-card {
      background: #111;
      border-radius: 16px;
      padding: 20px 30px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .last-label { color: #888; font-size: 0.9rem; margin-bottom: 6px; }
    .last-time { font-size: 1.3rem; color: #adf; font-family: monospace; }

    .log-card {
      background: #111;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
    }
    .log-title {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-clear {
      background: none;
      border: 1px solid #444;
      color: #666;
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .log-clear:hover { border-color: #888; color: #aaa; }
    .log-empty { color: #444; font-size: 0.85rem; text-align: center; padding: 10px 0; }
    .log-entry {
      border-bottom: 1px solid #1e1e2e;
      padding: 8px 0;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: #adf; font-family: monospace; }
    .log-duration { color: #fa0; font-family: monospace; font-size: 0.8rem; }

    .mqtt-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #888;
      display: inline-block;
      margin-left: 6px;
    }
    .mqtt-dot.connected { background: #4f4; }
    .mqtt-status { font-size: 0.8rem; color: #666; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>💧 Flow Meter</h1>

  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>

  <div class="status-card" id="statusCard">
    <div class="status-value ok" id="statusValue">אין הזנת מים</div>
  </div>

  <div class="last-card">
    <div class="last-label">פעם אחרונה שזוהו מים</div>
    <div class="last-time" id="lastTime">אף פעם</div>
  </div>

  <div class="log-card">
    <div class="log-title">
      <span>יומן אירועים</span>
      <button class="log-clear" onclick="clearLog()">נקה</button>
    </div>
    <div id="logList"><div class="log-empty">אין אירועים עדיין</div></div>
  </div>

  <div class="mqtt-status">
    <span class="mqtt-dot" id="mqttDot"></span>
    <span id="mqttStatus">מתחבר...</span>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const ss = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
      const dd = String(now.getDate()).padStart(2,'0');
      const mo = String(now.getMonth()+1).padStart(2,'0');
      const yy = now.getFullYear();
      document.getElementById('date').textContent = `${dd}/${mo}/${yy}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let detectStart = null;
    let events = [];

    function formatTime(d) {
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }

    function formatDuration(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60) return `${s} שנ'`;
      const m = Math.floor(s / 60), r = s % 60;
      return `${m}:${String(r).padStart(2,'0')} דק'`;
    }

    function renderLog() {
      const el = document.getElementById('logList');
      if (events.length === 0) {
        el.innerHTML = '<div class="log-empty">אין אירועים עדיין</div>';
        return;
      }
      el.innerHTML = events.slice().reverse().map(e => `
        <div class="log-entry">
          <div>
            <div class="log-time">${e.start} — ${e.end || '...'}</div>
            <div style="color:#666;font-size:0.75rem">${e.date}</div>
          </div>
          <div class="log-duration">${e.duration || '...'}</div>
        </div>
      `).join('');
    }

    function clearLog() {
      events = [];
      renderLog();
    }

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
      document.getElementById('mqttDot').classList.add('connected');
      document.getElementById('mqttStatus').textContent = 'מחובר';
      client.subscribe('water-sensor/status');
    });

    client.on('disconnect', () => {
      document.getElementById('mqttDot').classList.remove('connected');
      document.getElementById('mqttStatus').textContent = 'מנותק';
    });

    client.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        const card = document.getElementById('statusCard');
        const val  = document.getElementById('statusValue');
        const now  = new Date();

        if (data.detected) {
          card.classList.add('alert');
          val.className = 'status-value high';
          val.textContent = '⚠️ מד ספיקה לקראת ריקון';
          document.getElementById('lastTime').textContent = data.time || formatTime(now);

          detectStart = now;
          const dd = String(now.getDate()).padStart(2,'0');
          const mo = String(now.getMonth()+1).padStart(2,'0');
          const yy = now.getFullYear();
          events.push({ start: formatTime(now), end: null, duration: null, date: `${dd}/${mo}/${yy}`, _start: now });
          renderLog();
        } else {
          card.classList.remove('alert');
          val.className = 'status-value ok';
          val.textContent = 'אין הזנת מים';

          if (events.length > 0) {
            const last = events[events.length - 1];
            if (!last.end) {
              last.end = formatTime(now);
              last.duration = formatDuration(now - last._start);
              renderLog();
            }
          }
          detectStart = null;
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
