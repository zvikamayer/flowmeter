<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💧 Flow Meter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 20px; color: #adf; }

    .clock {
      font-size: 4rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #fff;
      font-family: monospace;
    }
    .date {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 30px;
    }

    .status-card {
      background: #111;
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 400px;
      border: 2px solid #333;
      transition: border-color 0.3s;
    }
    .status-card.alert { border-color: #f44; background: #200; }
    .status-value { font-size: 2.5rem; font-weight: bold; }
    .status-value.ok { color: #4f4; }
    .status-value.high { color: #f44; }

    .last-card {
      background: #111;
      border-radius: 16px;
      padding: 20px 30px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .last-label { color: #888; font-size: 0.9rem; margin-bottom: 6px; }
    .last-time { font-size: 1.3rem; color: #adf; font-family: monospace; }

    .ml-card {
      background: #111;
      border-radius: 16px;
      padding: 16px 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ml-card label { color: #888; font-size: 0.9rem; white-space: nowrap; }
    .ml-card input {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      padding: 6px 10px;
      font-size: 1rem;
      text-align: center;
      width: 80px;
    }
    .ml-card input:focus { outline: none; border-color: #adf; }
    .ml-card span { color: #888; font-size: 0.9rem; }
    .ml-total { margin-right: auto; color: #4f4; font-weight: bold; font-size: 1rem; }

    .flow-card {
      background: #111;
      border-radius: 16px;
      padding: 16px 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
    }
    .flow-title { color: #888; font-size: 0.9rem; margin-bottom: 12px; }
    .flow-rows { display: flex; flex-direction: column; gap: 8px; }
    .flow-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #0d0d1f;
      border-radius: 8px;
    }
    .flow-label { color: #666; font-size: 0.85rem; }
    .flow-value { color: #adf; font-family: monospace; font-size: 1.1rem; font-weight: bold; }

    .log-card {
      background: #111;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
    }
    .log-title {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-clear {
      background: none;
      border: 1px solid #444;
      color: #666;
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .log-clear:hover { border-color: #888; color: #aaa; }
    .log-empty { color: #444; font-size: 0.85rem; text-align: center; padding: 10px 0; }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { color: #555; font-weight: normal; padding: 4px 6px; border-bottom: 1px solid #222; text-align: right; }
    td { padding: 7px 6px; border-bottom: 1px solid #1a1a2e; }
    td.t-time { color: #adf; font-family: monospace; }
    td.t-dur  { color: #888; font-family: monospace; }
    td.t-ml   { color: #4f4; font-family: monospace; font-weight: bold; }
    td.t-total{ color: #fa0; font-family: monospace; }
    tr:last-child td { border-bottom: none; }

    .tank-card {
      background: #111;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
      text-align: center;
      direction: ltr;
    }
    .tank-title { color: #888; font-size: 0.9rem; margin-bottom: 12px; }
    .tank-overflow { color: #f44; font-weight: bold; font-size: 1rem; margin-top: 8px; display: none; }

    .conn-card {
      background: #111;
      border-radius: 16px;
      padding: 14px 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #333;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .conn-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .conn-dot.on { background: #4f4; box-shadow: 0 0 6px #4f4; }
    .conn-dot.off { background: #f44; }
    .conn-text { font-size: 0.9rem; }
    .conn-title { color: #aaa; }
    .conn-sub { color: #555; font-size: 0.78rem; margin-top: 2px; }

    .mqtt-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #888;
      display: inline-block;
      margin-left: 6px;
    }
    .mqtt-dot.connected { background: #4f4; }
    .mqtt-status { font-size: 0.8rem; color: #666; margin-top: 10px; }

    @media (max-width: 420px) {
      body { padding: 12px; }
      h1 { font-size: 1.4rem; margin-bottom: 14px; }
      .clock { font-size: 3rem; letter-spacing: 2px; }
      .date { font-size: 1rem; margin-bottom: 20px; }
      .status-card { padding: 20px; }
      .status-value { font-size: 1.8rem; }
      .last-card { padding: 14px; }
      .ml-card { padding: 12px; flex-wrap: wrap; }
      .flow-card { padding: 12px; }
      .log-card { padding: 14px; }
      table { font-size: 0.72rem; }
      td, th { padding: 5px 4px; }
      .flow-value { font-size: 1rem; }
    }
    .log-table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>💧 Flow Meter</h1>

  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>

  <div class="tank-card">
    <div class="tank-title">מפלס מיכל</div>
    <div style="position:relative; display:inline-block; direction:ltr;">
      <svg viewBox="0 0 160 210" width="140" height="184">
        <defs>
          <clipPath id="tankClip">
            <rect x="12" y="22" width="136" height="156"/>
          </clipPath>
        </defs>
        <!-- גוף מיכל -->
        <rect x="10" y="20" width="140" height="160" fill="#1a1a2e" stroke="none"/>
        <line x1="10"  y1="20" x2="10"  y2="180" stroke="#444" stroke-width="2"/>
        <line x1="150" y1="20" x2="150" y2="180" stroke="#444" stroke-width="2"/>
        <ellipse cx="80" cy="180" rx="70" ry="18" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
        <!-- מים -->
        <rect id="waterFill" x="12" y="178" width="136" height="0" fill="#29b6f6" opacity="0.75" clip-path="url(#tankClip)"/>
        <ellipse id="waterTop" cx="80" cy="178" rx="68" ry="9" fill="#29b6f6" opacity="0.9" clip-path="url(#tankClip)"/>
        <!-- קווי רמה עדינים -->
        <line x1="10" y1="164" x2="150" y2="164" stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="148" x2="150" y2="148" stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="132" x2="150" y2="132" stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="116" x2="150" y2="116" stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="100" x2="150" y2="100" stroke="#ffffff20" stroke-width="1"/>
        <line x1="10" y1="84"  x2="150" y2="84"  stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="68"  x2="150" y2="68"  stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="52"  x2="150" y2="52"  stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="36"  x2="150" y2="36"  stroke="#ffffff10" stroke-width="1"/>
        <line x1="10" y1="20"  x2="150" y2="20"  stroke="#ffffff20" stroke-width="1"/>
        <!-- אחוז במרכז -->
        <text id="levelText" x="80" y="108" text-anchor="middle" fill="#fff" font-size="26" font-weight="bold">0%</text>
        <!-- מכסה עליון -->
        <ellipse cx="80" cy="20" rx="70" ry="18" fill="#1a1a2e" stroke="#666" stroke-width="2"/>
      </svg>
      <!-- תוויות ממוקמות בדיוק לצד כל קו (position absolute) -->
      <span style="position:absolute;top:5px;left:143px;font-size:9px;color:#f44;white-space:nowrap;">גלישה</span>
      <span style="position:absolute;top:15px;left:143px;font-size:9px;color:#888;white-space:nowrap;">100%</span>
      <span style="position:absolute;top:29px;left:143px;font-size:9px;color:#555;white-space:nowrap;">90%</span>
      <span style="position:absolute;top:43px;left:143px;font-size:9px;color:#555;white-space:nowrap;">80%</span>
      <span style="position:absolute;top:57px;left:143px;font-size:9px;color:#555;white-space:nowrap;">70%</span>
      <span style="position:absolute;top:71px;left:143px;font-size:9px;color:#555;white-space:nowrap;">60%</span>
      <span style="position:absolute;top:85px;left:143px;font-size:9px;color:#888;white-space:nowrap;">50%</span>
      <span style="position:absolute;top:99px;left:143px;font-size:9px;color:#555;white-space:nowrap;">40%</span>
      <span style="position:absolute;top:113px;left:143px;font-size:9px;color:#555;white-space:nowrap;">30%</span>
      <span style="position:absolute;top:127px;left:143px;font-size:9px;color:#555;white-space:nowrap;">20%</span>
      <span style="position:absolute;top:141px;left:143px;font-size:9px;color:#555;white-space:nowrap;">10%</span>
    </div>
    <div class="tank-overflow" id="tankOverflow">⚠️ גלישה! תקלה!</div>
  </div>

  <div class="conn-card">
    <div class="conn-dot off" id="connDot"></div>
    <div class="conn-text">
      <div class="conn-title" id="connTitle">בקר לא מחובר</div>
      <div class="conn-sub" id="connSub"></div>
    </div>
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-value ok" id="statusValue">אין הזנת מים</div>
  </div>

  <div class="last-card">
    <div class="last-label">פעם אחרונה שזוהו מים</div>
    <div class="last-time" id="lastTime">אף פעם</div>
  </div>

  <div class="ml-card">
    <label>נפח ריקון:</label>
    <input type="number" id="drainVolume" value="0" min="0" step="1" readonly style="background:#0d0d1f;cursor:default;width:80px;">
    <span>מ"ל</span>
    <button id="volBtn" onclick="unlockVol()" style="background:none;border:1px solid #444;color:#666;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:0.75rem;margin-right:8px;">שנה</button>
  </div>

  <div class="last-card" style="text-align:center;">
    <button id="calibBtn" onclick="startCalib()" style="background:#1a2a1a;border:1px solid #4a4;color:#8f8;border-radius:10px;padding:10px 20px;cursor:pointer;font-size:1rem;width:100%;">⚙️ חישוב ספיקה ראשוני</button>
    <div id="calibStatus" style="margin-top:8px;font-size:0.85rem;color:#888;min-height:20px;"></div>
  </div>

  <div class="flow-card">
    <div class="flow-title">ספיקה (ליטר/שעה)</div>
    <div class="flow-rows">
      <div class="flow-row">
        <span class="flow-value" id="flow15">—</span>
        <span class="flow-label">L/h &nbsp;|&nbsp; 15 דקות אחרונות</span>
      </div>
      <div class="flow-row">
        <span class="flow-value" id="flow30">—</span>
        <span class="flow-label">L/h &nbsp;|&nbsp; 30 דקות אחרונות</span>
      </div>
      <div class="flow-row">
        <span class="flow-value" id="flow60">—</span>
        <span class="flow-label">L/h &nbsp;|&nbsp; שעה אחרונה</span>
      </div>
    </div>
  </div>

  <div class="log-card">
    <div class="log-title">
      <span>יומן אירועים</span>
      <button class="log-clear" onclick="clearLog()">נקה</button>
    </div>
    <div class="log-table-wrap"><div id="logList"><div class="log-empty">אין אירועים עדיין</div></div></div>
  </div>

  <div class="mqtt-status">
    <span class="mqtt-dot" id="mqttDot"></span>
    <span id="mqttStatus">מתחבר...</span>
  </div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('date').textContent =
        `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
    }
    function pad(n) { return String(n).padStart(2,'0'); }
    function fmtTime(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    function fmtDur(ms) {
      const s = Math.round(ms/1000);
      if (s < 60) return `${s}s`;
      return `${Math.floor(s/60)}:${pad(s%60)}m`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const UNLOCK_CODE = '7408';

    const drainVolInput = document.getElementById('drainVolume');

    function unlockVol() {
      const btn = document.getElementById('volBtn');
      if (drainVolInput.readOnly) {
        const code = prompt('הכנס קוד לשינוי:');
        if (code === UNLOCK_CODE) {
          drainVolInput.readOnly = false;
          drainVolInput.style.background = '#1a1a2e';
          drainVolInput.style.cursor = 'auto';
          drainVolInput.focus();
          btn.textContent = 'שמור';
          btn.style.borderColor = '#4f4';
          btn.style.color = '#4f4';
        } else if (code !== null) {
          alert('קוד שגוי');
        }
      } else {
        drainVolInput.readOnly = true;
        drainVolInput.style.background = '#0d0d1f';
        drainVolInput.style.cursor = 'default';
        btn.textContent = '✓ נשמר';
        btn.style.borderColor = '#444'; btn.style.color = '#666';
        setTimeout(() => { btn.textContent = 'שנה'; }, 2000);
      }
    }

    function getDrainVol() { return (parseFloat(drainVolInput.value) || 0) / 1000; } // מ"ל → ליטר לחישוב

    // מצב כיול
    let calibMode = false;
    let calibWaiting = false; // ממתין לתחילת ריקון
    let calibStart = null;
    let calibTimer = null;

    function startCalib() {
      if (calibMode) return;
      calibMode = true;
      calibWaiting = true;
      document.getElementById('calibBtn').textContent = '⏳ ממתין לריקון...';
      document.getElementById('calibBtn').style.background = '#1a1a2a';
      document.getElementById('calibStatus').textContent = 'כאשר D19 יסגור מעגל — הכיול יתחיל אוטומטית';
    }

    function calibStartDrain() {
      calibWaiting = false;
      calibStart = Date.now();
      let sec = 0;
      document.getElementById('calibBtn').textContent = '⏱️ מודד ריקון...';
      calibTimer = setInterval(() => {
        sec++;
        document.getElementById('calibStatus').textContent = `זמן ריקון: ${sec} שניות`;
      }, 1000);
    }

    function calibEndDrain() {
      if (!calibStart) return;
      clearInterval(calibTimer);
      const durationMs = Date.now() - calibStart;
      const durationSec = Math.round(durationMs / 1000);
      calibMode = false;
      calibStart = null;

      const vol = prompt(`הריקון נמשך ${durationSec} שניות.\nהכנס את נפח המים שהתרוקן (מ"ל):`);
      if (vol !== null && parseFloat(vol) > 0) {
        const ml = parseFloat(vol);
        drainVolInput.value = Math.round(ml);
        const lph = ((ml / 1000) / (durationMs / 3600000)).toFixed(2);
        document.getElementById('calibBtn').textContent = '✓ כיול הושלם';
        document.getElementById('calibBtn').style.background = '#1a2a1a';
        document.getElementById('calibStatus').textContent = `נפח: ${ml} מ"ל | זמן: ${durationSec}ש׳ | ספיקה: ${lph} L/h`;
      } else {
        document.getElementById('calibBtn').textContent = '⚙️ חישוב ספיקה ראשוני';
        document.getElementById('calibStatus').textContent = 'בוטל';
      }
    }

    // אירועי ריקון
    let events = [];
    let totalLiters = 0;
    let currentDrainStart = null;

    function renderLog() {
      const el = document.getElementById('logList');
      if (!events.length) { el.innerHTML = '<div class="log-empty">אין אירועים עדיין</div>'; return; }
      let html = '<table><tr><th>שעה</th><th>משך</th><th>מ"ל</th><th>L/h</th></tr>';
      events.slice().reverse().forEach(e => {
        html += `<tr style="border-top:1px solid #333;">
          <td class="t-time">${e.start}${e.end ? '–'+e.end : ' ...'}<br><span style="color:#444;font-size:0.7rem">${e.date}</span></td>
          <td class="t-dur">${e.duration || '...'}</td>
          <td class="t-ml">${e.liters != null ? Math.round(e.liters*1000)+' מ"ל' : '...'}</td>
          <td class="t-total">${e.lph != null ? e.lph+' L/h' : '...'}</td>
        </tr>`;
        if (e.levelSegments && e.levelSegments.length > 0) {
          e.levelSegments.forEach(s => {
            if (s.toLevel === null) return;
            html += `<tr style="background:#0a0a18;font-size:0.78rem;color:#666;">
              <td style="padding:2px 4px;color:#555;">${fmtTime(s.startTime)}–${s.endTime ? fmtTime(s.endTime) : '...'}</td>
              <td style="padding:2px 4px;">${s.duration || '...'}</td>
              <td colspan="2" style="padding:2px 4px;">${s.fromLevel}% → ${s.toLevel}%</td>
            </tr>`;
          });
        }
      });
      html += '</table>';
      el.innerHTML = html;
    }

    function clearLog() { events = []; totalLiters = 0; renderLog(); updateFlow(); }

    function calcFlow(windowMin) {
      const cutoff = Date.now() - windowMin * 60 * 1000;
      const done = events.filter(e => e._end && e._end.getTime() >= cutoff && e.durationMs > 0);
      if (!done.length) return '—';
      const totalVol = done.reduce((s, e) => s + (e.liters || 0), 0);
      const totalDurH = done.reduce((s, e) => s + (e.durationMs / 3600000), 0);
      if (totalDurH === 0) return '—';
      return (totalVol / totalDurH).toFixed(2);
    }

    function updateFlow() {
      document.getElementById('flow15').textContent = calcFlow(15);
      document.getElementById('flow30').textContent = calcFlow(30);
      document.getElementById('flow60').textContent = calcFlow(60);
    }

    setInterval(updateFlow, 10000);

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');


    client.on('connect', () => {
      document.getElementById('mqttDot').classList.add('connected');
      document.getElementById('mqttStatus').textContent = 'מחובר';
      client.subscribe('water-sensor/status');
      client.subscribe('water-sensor/info');
      client.subscribe('water-sensor/config');
      client.subscribe('water-sensor/level');
    });
    client.on('disconnect', () => {
      document.getElementById('mqttDot').classList.remove('connected');
      document.getElementById('mqttStatus').textContent = 'מנותק';
    });

    client.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        const now  = new Date();
        const card = document.getElementById('statusCard');
        const val  = document.getElementById('statusValue');

        if (topic === 'water-sensor/level') {
          const level = data.level || 0;
          const overflow = data.overflow || false;
          // גובה המים ב-SVG: y=178 (ריק) עד y=22 (מלא) = 156px
          const fillH = Math.round((level / 100) * 156);
          const fillY = 178 - fillH;
          document.getElementById('waterFill').setAttribute('y', fillY);
          document.getElementById('waterFill').setAttribute('height', fillH);
          document.getElementById('waterTop').setAttribute('cy', fillY);
          document.getElementById('levelText').textContent = level + '%';
          document.getElementById('waterFill').setAttribute('fill', overflow ? '#f44' : '#29b6f6');
          document.getElementById('waterTop').setAttribute('fill', overflow ? '#f44' : '#29b6f6');
          document.getElementById('tankOverflow').style.display = overflow ? 'block' : 'none';

          // תיעוד מפלס בזמן ריקון
          if (currentDrainStart && events.length > 0) {
            const ev = events[events.length - 1];
            if (!ev.levelSegments) ev.levelSegments = [];
            const segs = ev.levelSegments;
            if (segs.length > 0) {
              const prev = segs[segs.length - 1];
              if (!prev.endTime && prev.fromLevel !== level) {
                prev.endTime = now;
                prev.toLevel = level;
                prev.duration = fmtDur(now - prev.startTime);
                segs.push({ fromLevel: level, startTime: now, endTime: null, toLevel: null, duration: null });
                renderLog();
              }
            } else {
              segs.push({ fromLevel: level, startTime: now, endTime: null, toLevel: null, duration: null });
            }
          }
          return;
        }

        if (topic === 'water-sensor/config') {
          mlInput.value = data.ml || 0;
          return;
        }

        if (topic === 'water-sensor/info') {
          if (data.online) {
            document.getElementById('connDot').className = 'conn-dot on';
            document.getElementById('connTitle').textContent = 'בקר מחובר ✓';
            document.getElementById('connSub').textContent = `רשת: ${data.ssid}  |  IP: ${data.ip}`;
          } else {
            document.getElementById('connDot').className = 'conn-dot off';
            document.getElementById('connTitle').textContent = 'בקר מנותק';
            document.getElementById('connSub').textContent = '';
          }
          return;
        }

        if (data.detected) {
          // מיכל בריקון
          card.classList.add('alert');
          val.className = 'status-value high';
          val.textContent = '⚠️ מיכל בריקון';
          document.getElementById('lastTime').textContent = data.time || fmtTime(now);

          // כיול ראשוני
          if (calibMode && calibWaiting) {
            calibStartDrain();
          }

          // אירוע ריקון רגיל (אחרי כיול)
          if (!calibMode && !currentDrainStart) {
            currentDrainStart = now;
            events.push({ start: fmtTime(now), end: null, duration: null, liters: null, lph: null,
                          date: `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`,
                          _start: now, _end: null, durationMs: 0 });
            renderLog();
          }

        } else {
          // ריקון הסתיים
          card.classList.remove('alert');
          val.className = 'status-value ok';
          val.textContent = 'אין הזנת מים';

          // סיום כיול
          if (calibMode && !calibWaiting) {
            calibEndDrain();
          }

          // סיום אירוע ריקון רגיל
          if (currentDrainStart && events.length > 0) {
            const last = events[events.length - 1];
            if (!last.end) {
              const durationMs = now - currentDrainStart;
              const vol = getDrainVol();
              const lph = durationMs > 0 && vol > 0 ? (vol / (durationMs / 3600000)).toFixed(2) : null;
              last.end = fmtTime(now);
              last.duration = fmtDur(durationMs);
              last.liters = vol;
              last.lph = lph;
              last._end = now;
              last.durationMs = durationMs;
              totalLiters += vol;
              // סגור סגמנט מפלס אחרון
              if (last.levelSegments && last.levelSegments.length > 0) {
                const lastSeg = last.levelSegments[last.levelSegments.length - 1];
                if (!lastSeg.endTime) {
                  lastSeg.endTime = now;
                  lastSeg.toLevel = lastSeg.fromLevel;
                  lastSeg.duration = fmtDur(now - lastSeg.startTime);
                }
              }
              renderLog();
              updateFlow();
            }
            currentDrainStart = null;
          }
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
